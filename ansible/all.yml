---
- hosts: all
  become: true
  become_user: root
  roles:
    - role: usegalaxy_ca.network
      tags: network

- name: volumes
  import_playbook: volumes.yml

- name: slurm
  import_playbook: slurm.yml

- hosts: dbservers
  become: true
  become_user: root
  vars_files:
    - group_vars/secret.yml
    - group_vars/terraform.yml
  pre_tasks:
    - name: install dependencies
      package:
        name: "acl"
      tags:
        - always
  roles:
    - usegalaxy_ca.postgresql
    - galaxyproject.postgresql
    - role: usegalaxy_ca.restart_postgres
      tags:
        - never
    - role: galaxyproject.postgresql_objects
      become: true
      become_user: postgres
    - usegalaxy_ca.gxadmin
    - galaxyproject.gxadmin
    - usegalaxy_ca.backup_pg
    - role: usegalaxy_ca.kui
      when: inventory_hostname.startswith('prod-') # only set it up on prod
      tags:
        - never
        - kui
  post_tasks:
    - name: Enable pgcrypto extension for galaxy database
      community.postgresql.postgresql_ext:
        name: pgcrypto
        db: "{{ galaxy_db_name }}"
      become: true
      become_user: postgres

- name: tusd
  import_playbook: tusd.yml

- name: galaxy
  import_playbook: galaxy.yml

# Apply TIaaS table/sequence grants AFTER galaxy.yml initializes Galaxy's DB schema
# running these in the earlier dbservers play fails on fresh deployments with missing relations.
- hosts: dbservers
  become: true
  become_user: postgres
  vars_files:
    - group_vars/secret.yml
  roles:
    - role: galaxyproject.postgresql_objects
      postgresql_objects_users: []
      postgresql_objects_databases: []
      postgresql_objects_privileges: "{{ tiaas_postgresql_objects_privileges }}"

- name: monitor
  import_playbook: monitor.yml

- name: tsm backups
  import_playbook: tsm_backup.yml
