- name: Create Folder
  file:
    path: /mnt/backup
    owner: postgres
    group: postgres
    state: directory
    mode: 0700

- name: install cargo
  package:
    name: "cargo"
    state: present

- name: install backup-rotation cli
  command:
    cmd: cargo install --git https://github.com/usegalaxy-ca/backup-rotation.git
  become_user: postgres
  become: true

- name: pgpass
  copy:
    content: |
      {{ groups['dbservers'][0] }}:5432:{{ galaxy_db_name }}:{{ galaxy_user_name }}:{{ galaxy_postgres_password }}
      {{ groups['dbservers'][0] }}:5432:tiaas:tiaas:{{ tiaas_postgres_password }}
    dest: /home/postgres/.pgpass
    owner: "postgres"
    group: "postgres"
    mode: "0600"

- name: Cron job for psql backup
  ansible.builtin.cron:
    name: "Backup psql ({{ item }})"
    hour: "3"
    minute: "0"
    user: "postgres"
    job: "pg_dump -d {{ item }} -Fc > /mnt/backup/pg_{{ item }}_$(date +\\%Y-\\%m-\\%d_\\%H--\\%M-\\%S).tar"
  loop:
    - "{{ galaxy_db_name }}"
    - tiaas

- name: Cron job for psql backup rotation
  ansible.builtin.cron:
    name: "Rotate psql backups ({{ item }})"
    hour: "3"
    minute: "30"
    user: "postgres"
    job: "~/.cargo/bin/backup-rotation --format pg_{{ item }}_\\%Y-\\%m-\\%d_\\%H--\\%M-\\%S.tar /mnt/backup/pg_{{ item }}_*.tar"
  loop:
    - "{{ galaxy_db_name }}"
    - tiaas
