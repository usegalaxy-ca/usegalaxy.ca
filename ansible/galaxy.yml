- hosts: galaxyservers
  become: true
  become_user: root
  vars:
    slurm_roles: ["exec"]
  vars_files:
    - group_vars/secret.yml
    - group_vars/slurm.yml
    - group_vars/cvmfsclient.yml
    - group_vars/tiaas.yml
  pre_tasks:
    - name: install dependencies
      package:
        name:
          [
            "acl",
            "bzip2",
            "git",
            "jq",
            "make",
            "tar",
            "python3-venv",
            "python3-setuptools",
          ]
      tags:
        - always
    - name: ensure nginx cilogon cache directory exists
      ansible.builtin.file:
        path: "{{ nginx_cilogon_cache_dir }}"
        state: directory
        owner: "{{ nginx_user.name }}"
        group: "{{ nginx_group.name }}"
        mode: "0700"
  roles:
    - role: galaxyproject.galaxy
      tags:
        - never
    - role: galaxyproject.galaxy
      galaxy_build_client: false
    - role: usegalaxy_ca.tpv_auto_lint
      become: true
      become_user: "{{ galaxy_user_name }}"
    - role: usegalaxy_ca.client
      become: true
      become_user: "{{ galaxy_privsep_user }}"
    - role: galaxyproject.miniconda
      become: true
      become_user: "{{ galaxy_user_name }}"
    - usegalaxy_ca.maintenance
    - galaxyproject.tiaas2
    - galaxyproject.nginx
    - usegalaxy_ca.drmaa
    - role: usegalaxy_ca.restart_galaxy
      become: true
      become_user: root
    - role: usegalaxy_ca.service_account
      become: false
    - role: usegalaxy_ca.cleanup
      become: true
      become_user: root
      tags:
        - cleanup

  post_tasks:
    - name: deploy allocation groups python script
      ansible.builtin.template:
        src: templates/galaxy/cron_scripts/set_new_users_allocation_groups.py.j2
        dest: /opt/set_new_users_allocation_groups.py
        owner: "{{ galaxy_privsep_user }}"
        group: "{{ galaxy_privsep_user }}"
        mode: "0600"
      no_log: true
    - name: deploy galaxy cron wrapper scripts
      ansible.builtin.template:
        src: "templates/galaxy/cron_scripts/{{ item }}.j2"
        dest: "/opt/{{ item }}"
        owner: "{{ galaxy_privsep_user }}"
        group: "{{ galaxy_privsep_user }}"
        mode: "0700"
      loop:
        - set_new_users_allocation_groups.bash
        - fetch-edugain-idps.bash
    - name: fetch edugain idps the first time
      ansible.builtin.command: "bash /opt/fetch-edugain-idps.bash"
      become: true
      become_user: "{{ galaxy_privsep_user }}"
    - name: set cron jobs
      ansible.builtin.cron:
        name: "cron jobs to adjust allocations group for canadian users"
        minute: "*/30"
        user: "{{ galaxy_privsep_user }}"
        job: "bash /opt/set_new_users_allocation_groups.bash"
