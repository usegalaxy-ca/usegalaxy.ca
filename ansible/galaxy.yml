- hosts: galaxyservers
  become: true
  become_user: root
  vars:
    slurm_roles: ["exec"]
  vars_files:
    - group_vars/secret.yml
    - group_vars/slurm.yml
    - group_vars/cvmfsclient.yml
    - group_vars/tiaas.yml
  pre_tasks:
    - name: install dependencies
      package:
        name:
          [
            "acl",
            "bzip2",
            "git",
            "make",
            "tar",
            "python3-venv",
            "python3-setuptools",
          ]
      tags:
        - always
    - name: ensure galaxy vault encryption key is configured
      ansible.builtin.assert:
        that:
          - GALAXY_VAULT_ENCRYPTION_KEY | length > 0
        fail_msg: "GALAXY_VAULT_ENCRYPTION_KEY environment variable must be set to a valid Fernet key."
        quiet: true
    - name: ensure nginx cilogon cache directory exists
      ansible.builtin.file:
        path: "{{ nginx_cilogon_cache_dir }}"
        state: directory
        owner: "{{ nginx_user.name }}"
        group: "{{ nginx_group.name }}"
        mode: "0700"
  roles:
    # Must precede galaxyproject.galaxy: its restart handler is flushed inside
    # galaxyproject.nginx (ssl-external.yml), and the Slurm runner needs libdrmaa.
    - usegalaxy_ca.drmaa
    - role: galaxyproject.galaxy
      tags:
        - never
    - role: galaxyproject.galaxy
      galaxy_build_client: false
    - role: usegalaxy_ca.tpv_auto_lint
      become: true
      become_user: "{{ galaxy_user_name }}"
    - role: usegalaxy_ca.client
      become: true
      become_user: "{{ galaxy_privsep_user }}"
    - role: galaxyproject.miniconda
      become: true
      become_user: "{{ galaxy_user_name }}"
    - usegalaxy_ca.maintenance
    - galaxyproject.tiaas2
    - galaxyproject.nginx
    - role: usegalaxy_ca.cleanup
      become: true
      become_user: root
      tags:
        - cleanup

  post_tasks:
    - name: galaxy nginx restart
      ansible.builtin.systemd:
        name: nginx
        state: restarted
    # Runs after the role handlers (restart galaxy, reload nginx) have flushed,
    # so the API key request doesn't hit a stale nginx config (e.g. maintenance page).
    - name: Setup service account
      ansible.builtin.import_role:
        name: usegalaxy_ca.service_account
      become: false
    - name: restrict permissions on galaxy vault config
      ansible.builtin.file:
        path: "{{ galaxy_config.galaxy.vault_config_file }}"
        mode: "0640"
      become: true
      become_user: "{{ galaxy_privsep_user }}"
    - name: restrict permissions on allocation groups cron script
      ansible.builtin.file:
        path: "{{ galaxy_server_dir }}/cron/set_new_users_allocation_groups.py"
        owner: "{{ galaxy_privsep_user }}"
        group: "{{ galaxy_privsep_user }}"
        mode: "0600"
      become: true
      become_user: "{{ galaxy_privsep_user }}"
    - name: fetch edugain idps the first time
      command: "bash {{ galaxy_root }}/server/cron/fetch-edugain-idps.bash"
      become: true
      become_user: pgalaxy
    - name: set cron jobs
      ansible.builtin.cron:
        name: "cron jobs to adjust allocations group for canadian users"
        minute: "*/5"
        user: pgalaxy
        job: "bash {{ galaxy_root }}/server/cron/set_new_users_allocation_groups.bash"
