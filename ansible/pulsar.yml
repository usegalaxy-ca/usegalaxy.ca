- hosts: pulsarservers
  become: yes
  become_user: root
  vars_files:
    - group_vars/secret.yml
    - group_vars/slurm.yml
    - group_vars/galaxyservers.yml
  pre_tasks:
    - name: Install some packages
      package:
        name:
          - build-essential
          - git
          - python3-dev
          - libcurl4-openssl-dev
          - libssl-dev
          - virtualenv
          - python3-venv
        state: present
        update_cache: yes
  roles:
    - usegalaxy_ca.drmaa
    - galaxyproject.pulsar
